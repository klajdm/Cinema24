<nav
  class="w-full left-0 top-0 fixed z-50 transition-all duration-300"
  [class.bg-cinema-darker]="scrolled"
  [class.shadow-2xl]="scrolled"
  [ngClass]="scrolled ? '' : 'bg-cinema-dark/80 backdrop-blur-md'"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a
        routerLink="/home"
        (click)="closeMenu()"
        class="flex items-center gap-2 group shrink-0"
      >
        <img
          src="./../../../../assets/Cinema24logo.png"
          alt="Cinema24"
          class="w-[130px] transition-opacity duration-200 group-hover:opacity-80"
        />
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-1">
        <a
          routerLink="/home"
          routerLinkActive="text-cinema-purple bg-white/5"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-cinema-purple-dim hover:text-white hover:bg-white/10 transition-all duration-200"
        >
          <mat-icon class="text-[18px] leading-none">movie</mat-icon>
          Home
        </a>
        <a
          routerLink="/watchlist"
          routerLinkActive="text-cinema-purple bg-white/5"
          class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-cinema-purple-dim hover:text-white hover:bg-white/10 transition-all duration-200"
        >
          <mat-icon class="text-[18px] leading-none">bookmark</mat-icon>
          Watchlist
          <span
            *ngIf="watchlistCount > 0"
            class="absolute -top-0.5 -right-0.5 bg-cinema-accent text-cinema-darker text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center leading-none"
            >{{ watchlistCount }}</span
          >
        </a>
        <a
          href="https://github.com/klajdm/Cinema24"
          target="_blank"
          rel="noopener"
          matTooltip="Source Code"
          class="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-cinema-purple-dim hover:text-white hover:bg-white/10 transition-all duration-200"
        >
          <mat-icon class="text-[18px] leading-none">open_in_new</mat-icon>
          GitHub
        </a>
      </div>

      <!-- Mobile menu button -->
      <button
        (click)="toggleMenu()"
        class="md:hidden p-2 rounded-lg text-cinema-purple-dim hover:text-white hover:bg-white/10 transition-all duration-200"
        aria-label="Toggle menu"
      >
        <mat-icon>{{ mobileMenuOpen ? "close" : "menu" }}</mat-icon>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div
    *ngIf="mobileMenuOpen"
    class="md:hidden bg-cinema-surface border-t border-white/5 animate-fade-in"
  >
    <div class="px-4 py-3 flex flex-col gap-1">
      <a
        routerLink="/home"
        routerLinkActive="text-cinema-purple bg-white/5"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        class="flex items-center gap-2 px-4 py-3 rounded-lg text-sm font-medium text-cinema-purple-dim hover:text-white hover:bg-white/10 transition-all duration-200"
      >
        <mat-icon class="text-[18px]">movie</mat-icon>
        Home
      </a>
      <a
        routerLink="/watchlist"
        routerLinkActive="text-cinema-purple bg-white/5"
        (click)="closeMenu()"
        class="flex items-center gap-2 px-4 py-3 rounded-lg text-sm font-medium text-cinema-purple-dim hover:text-white hover:bg-white/10 transition-all duration-200"
      >
        <mat-icon class="text-[18px]">bookmark</mat-icon>
        Watchlist
        <span
          *ngIf="watchlistCount > 0"
          class="ml-auto bg-cinema-accent text-cinema-darker text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center"
          >{{ watchlistCount }}</span
        >
      </a>
      <a
        href="https://github.com/klajdm/Cinema24"
        target="_blank"
        rel="noopener"
        (click)="closeMenu()"
        class="flex items-center gap-2 px-4 py-3 rounded-lg text-sm font-medium text-cinema-purple-dim hover:text-white hover:bg-white/10 transition-all duration-200"
      >
        <mat-icon class="text-[18px]">open_in_new</mat-icon>
        GitHub
      </a>
    </div>
  </div>
</nav>
